<!doctype html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<link rel="canonical" href="{{canonical}}">
{{{alternates}}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fostier Index">
<meta property="og:title" content="{{meta.title}}">
<meta property="og:description" content="{{meta.description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/assets/og.png">
<meta property="og:locale" content="{{ogLocale}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#030A08">
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{base}}assets/styles.css">
<script type="application/ld+json">{{{jsonld}}}</script>
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>

<canvas class="stage" data-prism aria-hidden="true"></canvas>
<div class="stage-labels" aria-hidden="true">
  <div class="tag tag-query" data-anchor="query"><span class="tag-dot"></span>{{hero.query}}</div>
  <div class="tag tag-cite" data-anchor="cite"><b>1</b>{{you}}</div>
</div>

<header class="top">
  <a class="word" href="{{home}}">Fostier Index</a>
  <nav class="langs" aria-label="{{langLabel}}">{{{langLinks}}}</nav>
  <a class="btn btn-quiet" href="#consult">{{nav.cta}}</a>
</header>

<main id="main">
  <section class="hero">
    <p class="sr-only">{{hero.sceneAlt}}</p>
    <h1>{{hero.title}}</h1>
    <div class="hero-side">
      <p class="lede">{{hero.sub}}</p>
      <a class="btn" href="#consult">{{hero.cta}}</a>
    </div>
  </section>
</main>

<script src="{{base}}assets/three.min.js"></script>
<script src="{{base}}assets/prism.js"></script>
</body>
</html>
